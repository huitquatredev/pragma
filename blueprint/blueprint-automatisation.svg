<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="780" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="padding: 20px;">
      <style>
        .blueprint-container { font-family: Outfit, sans-serif; background-color: #fef9f7; color: #0e0e0e; padding: 40px 30px; border-radius: 16px; box-shadow: rgba(8, 50, 125, 0.04) 0px 4px 24px; max-width: 900px; width: 100%; border: 1px solid rgba(8, 50, 125, 0.08); box-sizing: border-box; }
        .blueprint-header { text-align: center; margin-bottom: 40px; }
        .blueprint-header h2 { color: #08327D; margin: 0 0 10px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .blueprint-header p { color: #666; margin: 0; font-size: 16px; }
        .blueprint-canvas { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .step-column { flex: 1; border-radius: 12px; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; min-height: 480px; box-sizing: border-box; }
        .step-muted { background-color: rgba(14, 14, 14, 0.01); border: 1px dashed rgba(14, 14, 14, 0.12); opacity: 0.4; }
        .step-badge { background-color: rgba(14, 14, 14, 0.08); color: #666; font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600; margin-bottom: 14px; }
        .step-title { font-weight: 700; font-size: 18px; color: #333; margin-bottom: 4px; }
        .step-subtitle { font-size: 13px; color: #777; margin-bottom: 25px; }
        .step-preview-box { width: 100%; background-color: #fff; border: 1px solid rgba(14, 14, 14, 0.05); padding: 12px; text-align: center; font-size: 13px; color: #888; border-radius: 8px; margin-bottom: 10px; font-weight: 600; box-sizing: border-box; }
        .blueprint-arrow-separator { font-size: 24px; color: rgba(8, 50, 125, 0.15); font-weight: bold; }
        .step-active { background-color: #fff; border: 2px solid #08327D; box-shadow: rgba(8, 50, 125, 0.1) 0px 12px 32px; position: relative; }
        .badge-highlight { background-color: #F45844; color: #fff; font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 700; margin-bottom: 14px; text-transform: uppercase; }
        .title-highlight { color: #08327D !important; font-size: 20px !important; font-weight: 800 !important; margin-bottom: 4px; }
        .subtitle-active { font-size: 13px; color: #F45844; font-weight: 700; margin-bottom: 25px; }
        .component-card { width: 100%; background-color: #fef9f7; border: 1px solid rgba(8, 50, 125, 0.12); border-radius: 10px; padding: 14px; display: flex; align-items: center; gap: 14px; text-align: left; box-sizing: border-box; }
        .card-letter { background-color: #08327D; color: #fff; width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
        .card-details { display: flex; flex-direction: column; }
        .card-details strong { font-size: 15px; color: #0e0e0e; margin-bottom: 2px; font-weight: 700; }
        .card-details span { font-size: 12px; color: #666; line-height: 1.3; }
        .inner-arrow { color: #F45844; font-size: 14px; margin: 6px 0; font-weight: bold; }
      </style>
      <div class="blueprint-container">
        <div class="blueprint-header">
            <h2>Phase Automatisation</h2>
            <p>Connecter les éléments de capture de leads.</p>
        </div>
        <div class="blueprint-canvas">
            <div class="step-column step-muted">
                <div class="step-badge">Étape 3</div>
                <div class="step-title">Acquisition</div>
                <div class="step-subtitle">Flux Extérieurs</div>
                <div class="step-preview-box">Réseaux Sociaux</div>
                <div class="step-preview-box">Blog d'entreprise</div>
                <div class="step-preview-box">Presse &amp; Tiers</div>
            </div>
            <div class="blueprint-arrow-separator">➔</div>
            <div class="step-column step-active">
                <div class="step-badge badge-highlight">Étape 2</div>
                <div class="step-title title-highlight">La Capture</div>
                <div class="step-subtitle subtitle-active">Moteur Automatisé</div>
                <div class="component-card">
                    <span class="card-letter">1</span>
                    <div class="card-details">
                        <strong>Quiz Tally (Leadmagnet)</strong>
                        <span>Questionnaire de qualification interactif</span>
                    </div>
                </div>
                <div class="inner-arrow">▼</div>
                <div class="component-card">
                    <span class="card-letter">2</span>
                    <div class="card-details">
                        <strong>Formulaire Brevo</strong>
                        <span>Capture e-mail intégrée en fin de quiz</span>
                    </div>
                </div>
                <div class="inner-arrow">▼</div>
                <div class="component-card">
                    <span class="card-letter">3</span>
                    <div class="card-details">
                        <strong>Page Résultats Hybride</strong>
                        <span>Diagnostic personnalisé + Vente douce</span>
                    </div>
                </div>
                <div class="inner-arrow">▼</div>
                <div class="component-card">
                    <span class="card-letter">4</span>
                    <div class="card-details">
                        <strong>Séquences Brevo (Mails 1-4)</strong>
                        <span>Mail 1 (Résultats) + Mails 2-4 (Confiance)</span>
                    </div>
                </div>
            </div>
            <div class="blueprint-arrow-separator">➔</div>
            <div class="step-column step-muted">
                <div class="step-badge">Étape 1</div>
                <div class="step-title">Conversion</div>
                <div class="step-subtitle">Les Fondations</div>
                <div class="step-preview-box">Home Page</div>
                <div class="step-preview-box">Page À Propos</div>
                <div class="step-preview-box">Landing Page</div>
            </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>